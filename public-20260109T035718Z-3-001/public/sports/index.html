<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sports</title>

  <!-- Swiper CSS -->
  <link rel="stylesheet" href="/sports/css/swiper-bundle.min.css" />

  <!-- Custom CSS -->
  <link rel="stylesheet" href="/sports/css/style.css" />
</head>

<body>

  <div class="slide-container swiper">
    <div class="slide-content">
      <div class="card-wrapper swiper-wrapper">

        <div class="card swiper-slide">
          <div class="image-content">
            <span class="overlay"></span>
            <div class="card-image">
              <img src="/sports/image.png" alt="Badminton" class="card-img" />
            </div>
          </div>
          <div class="card-content">
            <h2 class="name">Badminton</h2>
          </div>
        </div>

        <div class="card swiper-slide">
          <div class="image-content">
            <span class="overlay"></span>
            <div class="card-image">
              <img src="/sports/cricket-player-logo-design-illustration-vector.jpg" alt="Cricket" class="card-img" />
            </div>
          </div>
          <div class="card-content">
            <h2 class="name">Cricket</h2>
          </div>
        </div>

        <div class="card swiper-slide">
          <div class="image-content">
            <span class="overlay"></span>
            <div class="card-image">
              <img src="/sports/soccer-ball-goal.webp" alt="Football" class="card-img" />
            </div>
          </div>
          <div class="card-content">
            <h2 class="name">Football</h2>
          </div>
        </div>

        <div class="card swiper-slide">
          <div class="image-content">
            <span class="overlay"></span>
            <div class="card-image">
              <img src="/sports/photo.webp" alt="Basketball" class="card-img" />
            </div>
          </div>
          <div class="card-content">
            <h2 class="name">Basketball</h2>
          </div>
        </div>

        <div class="card swiper-slide">
          <div class="image-content">
            <span class="overlay"></span>
            <div class="card-image">
              <img src="/sports/world-table-tennis-day1.webp" alt="Table Tennis" class="card-img" />
            </div>
          </div>
          <div class="card-content">
            <h2 class="name">Table Tennis</h2>
          </div>
        </div>

        <div class="card swiper-slide">
          <div class="image-content">
            <span class="overlay"></span>
            <div class="card-image">
              <img src="/sports/images.jpg" alt="Swimming" class="card-img" />
            </div>
          </div>
          <div class="card-content">
            <h2 class="name">Swimming</h2>
          </div>
        </div>

      </div>
    </div>

    <div class="swiper-button-next swiper-navBtn"></div>
    <div class="swiper-button-prev swiper-navBtn"></div>
    <div class="swiper-pagination"></div>
  </div>

  <!-- Swiper JS -->
  <script src="/sports/js/swiper-bundle.min.js"></script>

  <!-- Custom JS -->
  <script src="/sports/js/script.js"></script>
</body>

</html>
